name: Release
on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run commitlint
        run: npx commitlint --last --verbose --config .config/commitlint.config.js

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: npx semantic-release

  build:
    name: Build ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: npm ci
      - name: Set release version
        shell: bash
        run: npm version "${{ needs.release.outputs.new_release_version }}" --no-git-tag-version --allow-same-version
      - name: Make distributables
        run: npm run make
      - name: Upload artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.new_release_git_tag }}
        run: |
          set --
          while IFS= read -r -d '' file; do
            set -- "$@" "$file"
          done < <(find out/make -type f \( \
            -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.zip' -o -name '*.nupkg' -o -name '*.dmg' -o \
            -name 'RELEASES' \
          \) -print0)

          if [ "$#" -eq 0 ]; then
            echo "No release artifacts found"
            find out -type f || true
            exit 1
          fi

          gh release upload "$TAG" "$@" --clobber
